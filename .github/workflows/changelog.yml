on:
  pull_request:
    # `labeled`/`unlabeled` so that adding or removing the `skip-changeset`
    # label re-evaluates the check: a run only sees the labels that existed when
    # its event fired.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

# A burst of pushes or label changes produces a run per event, and the last one
# to finish wins the check regardless of which state it saw. Superseding the
# in-flight run keeps the newest state authoritative. Safe to cancel here
# because this job is side-effect free, which is not true of the suites in
# checks.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# `gh pr diff` reads GET /pulls/{n}/files, so `pull-requests: read` is the actual
# dependency. The repository default is currently `write` on everything, so
# stating it here both documents the need and drops the rest.
permissions:
  contents: read
  pull-requests: read

name: Changelog
jobs:
  changelog:
    name: Changelog Entry
    # Admits `merge_group` while every step below excludes it, so a merge
    # group deliberately runs this as a no-op: a required context has to report
    # on the merge-group ref, and there is nothing left to check by then because
    # the pull request already passed.
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
       !contains(fromJSON('["renovate[bot]", "dependabot[bot]"]'), github.event.pull_request.user.login))
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this pull request needs a changeset
        id: need
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
        run: |
          # `set -eu` deliberately without `pipefail`: the pipeline below is a
          # `printf | grep -q` guard, and `grep -q` exits on its first match,
          # which can SIGPIPE the `printf`. Under `pipefail` that non-zero
          # status would mask a successful match and invert the check on a diff
          # large enough to fill the pipe buffer.
          set -eu

          if [ "$SKIP" = "true" ]; then
            echo "The \`skip-changeset\` label is set, so no changeset is required."
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guarded so an API failure reports itself as one, rather than as a
          # raw gh error. Failing closed is right for this check: there is no
          # conservative fallback to take.
          if ! CHANGED_FILES="$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)"; then
            echo '::error::Could not read the pull request diff to check for a changeset. This is an API failure, not a missing changeset; re-run the job.'
            exit 1
          fi

          if ! printf '%s\n' "$CHANGED_FILES" | grep -qvE '^docs/'; then
            echo "This PR only touches docs/, so no changeset is required."
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.need.outputs.required == 'true'
        with:
          # The check compares against the base branch, so it needs its history.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: steps.need.outputs.required == 'true'

      - name: Check the changesets this pull request adds
        if: steps.need.outputs.required == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! cargo xtask changeset check --base "$BASE_REF"; then
            echo "::error::Add a changeset to .changeset/ with \`mise run add-changeset\` (see .changeset/README.md), or add the \`skip-changeset\` label if the change isn't user-visible."
            exit 1
          fi
