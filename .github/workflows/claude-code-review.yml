on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

name: Claude Code Review
jobs:
  claude-review:
    # Pull requests from forks get no OIDC token or secrets, so this can only
    # fail there. Moving it to `pull_request_target` would point a job with
    # write access and our API key at untrusted content. A maintainer can ask
    # for a review on a fork's pull request by commenting `@claude` instead.
    if: >-
      !contains(fromJSON('["renovate[bot]", "dependabot[bot]"]'), github.event.pull_request.user.login)
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # The review command runs its reviewers as subagents. Run in the
          # background, they're abandoned when the main turn ends, and the
          # run finishes without posting a review. In the foreground, the
          # command waits for every reviewer before it posts.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          show_full_output: true
          additional_permissions: |
            actions: read
