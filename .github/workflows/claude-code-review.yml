on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

name: Claude Code Review
jobs:
  claude-review:
    # Pull requests from forks get no OIDC token or secrets, so this can only
    # fail there. Moving it to `pull_request_target` would point a job with
    # write access and our API key at untrusted content. A maintainer can ask
    # for a review on a fork's pull request by commenting `@claude` instead.
    if: >-
      !contains(fromJSON('["renovate[bot]", "dependabot[bot]"]'), github.event.pull_request.user.login)
      && github.event.pull_request.head.repo.full_name == github.repository
    # A newer push replaces the review of the older one. Overlapping runs would
    # also each snapshot before the other posts, leaving one review unhidden.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Remember the review comments Claude left on earlier runs, before this
      # run adds a new one, so only those get hidden afterwards. The review
      # command posts a pull request review whose body starts with its
      # heading, with each finding as an inline comment on that review. The
      # `@claude` mention workflow posts as the same bot, so take only the
      # inline comments that belong to such a review, to leave answers to
      # people's questions alone. GitHub can't hide a review's own body, so
      # the earlier summary stays visible above the new one.
      - name: Snapshot previous Claude review comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.user.login == "claude[bot]" and (.body | startswith("## Code review"))) | .id' \
            > "$RUNNER_TEMP/previous-claude-reviews.txt"
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq '.[] | [.pull_request_review_id, .node_id] | @tsv' \
            | awk -F'\t' 'NR == FNR { reviews[$1]; next } $1 in reviews { print $2 }' \
                "$RUNNER_TEMP/previous-claude-reviews.txt" - \
            > "$RUNNER_TEMP/previous-claude-comments.txt"
          echo "Found $(wc -l < "$RUNNER_TEMP/previous-claude-reviews.txt") earlier Claude reviews with $(wc -l < "$RUNNER_TEMP/previous-claude-comments.txt") inline comments"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # The review command runs its reviewers as subagents. Run in the
          # background, they're abandoned when the main turn ends, and the
          # run finishes without posting a review. In the foreground, the
          # command waits for every reviewer before it posts.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The review command stops on a pull request Claude has already
          # reviewed, but each push here is a request to review the new head.
          # The step after this hides the earlier review's comments.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Review the current head even if Claude has already reviewed an earlier commit of this pull request: this run follows new commits, and the earlier review's comments are hidden as outdated once this one posts.
          show_full_output: true
          additional_permissions: |
            actions: read

      # Only after the new review has posted, so a failed run leaves the last
      # good review visible. A failure to hide one comment shouldn't fail the
      # job, since the review itself already succeeded.
      - name: Hide previous Claude review comments as outdated
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r node_id; do
            [ -n "$node_id" ] || continue
            gh api graphql \
              -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
              -f id="$node_id" >/dev/null \
              || echo "::warning::Could not hide comment $node_id"
          done < "$RUNNER_TEMP/previous-claude-comments.txt"
