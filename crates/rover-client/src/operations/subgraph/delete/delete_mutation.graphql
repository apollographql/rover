mutation SubgraphDeleteMutation(
  $graph_id: ID!
  $variant: String!
  $subgraph: String!
) {
  graph(id: $graph_id) {
    removeImplementingServiceAndTriggerComposition(
      graphVariant: $variant
      name: $subgraph
      dryRun: false
    ) {
      errors {
        message
        code
      }
      updatedGateway
    }
  }
}
