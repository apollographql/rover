# Lightweight, `__typename`-only poll of an async compose-and-filter preview
# build (mdg-private/monorepo branch samaan/async-builds-3). Since
# `ComposeAndFilterPreviewStatus` is a real union with `Pending` as its own
# distinct member, `__typename` alone is enough to know whether the build has
# left PENDING/RUNNING, without fetching the (potentially large) schema
# documents or error lists that the full query selects. Those are fetched
# once via `compose_and_filter_preview_status_query.graphql` after the build
# is known to be finished — mirroring how `check_workflow_query.graphql` /
# `check_workflow_status_query.graphql` split a full and a status-only
# selection over the same underlying check workflow.
query ComposeAndFilterPreviewStatusLightQuery(
  $graph_id: ID!
  $variant: String!
  $build_id: ID!
) {
  graph(id: $graph_id) {
    variant(name: $variant) {
      composeAndFilterPreviewStatus(buildID: $build_id) {
        __typename
      }
    }
  }
}
