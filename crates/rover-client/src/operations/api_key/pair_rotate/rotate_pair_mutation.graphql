mutation RotatePairMutation($organizationId: ID!, $clientId: ID!, $gracePeriodDays: Int) {
    organization(id: $organizationId) {
        rotateOAuthClientSecret(clientId: $clientId, gracePeriodDays: $gracePeriodDays) {
            clientId
            clientName
            clientSecret
            secretExpiresAt
        }
    }
}
